<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensaje enviado</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  >
  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="confirmation-modern">

  <main class="confirmation-wrapper">
    <div class="confirmation-box">
      <div class="confirmation-icon">
        <i class="bi bi-check-lg"></i>
      </div>

      <span class="confirmation-kicker">MENSAJE ENVIADO</span>
      <h1>¡Gracias por contactarme!</h1>
      <p>Muy pronto nos pondremos en contacto.</p>

      <a href="/" class="btn btn-primary btn-lg confirmation-btn">
        <i class="bi bi-arrow-left me-2"></i>
        Volver al portafolio
      </a>
    </div>
  </main>

</body>
</html>
